[project]
name = "average-securities-rate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  "venv",
  "__pycache__",
  ".dockerignore",
  "docker-compose.yaml",

]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
