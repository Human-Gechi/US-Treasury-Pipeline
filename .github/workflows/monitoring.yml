name: Api Monitoring

on:
  schedule:
    - cron: '0 1,2,3,4,5,6,7 * * *'
  workflow_dispatch:

jobs:
  send_emails:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: pip install -r requirements.txt
